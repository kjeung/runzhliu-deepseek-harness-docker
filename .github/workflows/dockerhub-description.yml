name: Sync Docker Hub overview

# DISABLED: this repository no longer publishes images.
# Kept only as a record of how previously published tags were built. Every job
# below still runs a guard step that fails before any registry login or push,
# so the workflow cannot ship an image even if it is dispatched by mistake.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-overview
  cancel-in-progress: true

jobs:
  sync:
    name: Publish README and short description
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse to run (publishing is disabled)
        run: |
          echo "This repository no longer publishes container images." >&2
          echo "Build the image locally instead: make build (or docker compose build)." >&2
          exit 1
      - uses: actions/checkout@v7
      - name: Render the Docker Hub overview
        run: bash scripts/render-dockerhub-readme.sh README.md README.dockerhub.md
      - name: Update Docker Hub repository information
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: runzhliu
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: runzhliu/deepseek-harness
          short-description: Community Docker, Compose, and Helm runtime for DeepSeek Harness on amd64 and arm64.
          readme-filepath: ./README.dockerhub.md
          enable-url-completion: true
